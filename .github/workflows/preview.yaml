name: Preview CMS Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preview-cms-worker
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  PREVIEW_D1_DATABASE_ID: 0062fbf8-5cd3-4552-9115-ec3edd3e933c
  PREVIEW_ISOLATION_EXPECTATIONS: '{"workers/cms-api/wrangler.jsonc":{"workerName":"zes-cms-api-preview","databaseId":"0062fbf8-5cd3-4552-9115-ec3edd3e933c"},"wrangler.jsonc":{"databaseId":"0062fbf8-5cd3-4552-9115-ec3edd3e933c"}}'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy-preview-cms-worker:
    name: Deploy Preview CMS Worker
    runs-on: ubuntu-latest
    environment:
      name: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The guard runs before every step that can touch Cloudflare. It fails the
      # job when the preview environment is missing, when the preview worker
      # name or the preview database id is not the expected one, or when the
      # preview configuration shares the production worker or database.
      - name: Verify preview isolation
        run: node scripts/check-preview-isolation.mjs

      - name: Resolve deployment target
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { normalizeJsonc } from './scripts/check-preview-isolation.mjs';

            const config = JSON.parse(normalizeJsonc(readFileSync('workers/cms-api/wrangler.jsonc', 'utf8')));
            const preview = config.env?.preview;

            if (!preview?.name) {
              console.error('the env.preview section of workers/cms-api/wrangler.jsonc is missing');
              process.exit(1);
            }

            const database = (preview.d1_databases ?? [])[0];

            console.log('worker: ' + preview.name);
            console.log('database: ' + (database?.database_name ?? 'none'));
            console.log('database_id: ' + (database?.database_id ?? 'none'));

            if (preview.name !== 'zes-cms-api-preview') {
              console.error('refusing to deploy a worker named ' + preview.name);
              process.exit(1);
            }
          "

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Only env.preview is deployed. The top-level configuration of the Worker
      # points at the production database and at the production worker name, and
      # the guard above has already verified that the preview environment exists
      # and is isolated. The configuration is passed explicitly so that a stale
      # redirect configuration of the root build cannot redirect the deployment.
      - name: Deploy preview CMS Worker
        run: pnpm exec wrangler deploy --config workers/cms-api/wrangler.jsonc --env preview

      # The two secrets are read from the GitHub environment and written to the
      # preview Worker through stdin, so they never appear in an argument, in a
      # log line or in the workflow file.
      - name: Sync preview Worker secrets
        env:
          CMS_SERVICE_TOKEN: ${{ secrets.CMS_SERVICE_TOKEN }}
          CMS_ASSERTION_SECRET: ${{ secrets.CMS_ASSERTION_SECRET }}
        run: |
          printf '%s' "$CMS_SERVICE_TOKEN" | pnpm exec wrangler secret put CMS_SERVICE_TOKEN --config workers/cms-api/wrangler.jsonc --env preview
          printf '%s' "$CMS_ASSERTION_SECRET" | pnpm exec wrangler secret put CMS_ASSERTION_SECRET --config workers/cms-api/wrangler.jsonc --env preview

      - name: Verify preview Worker configuration
        run: |
          pnpm exec wrangler secret list --config workers/cms-api/wrangler.jsonc --env preview > secret-list.txt
          grep -q '^CMS_SERVICE_TOKEN' secret-list.txt
          grep -q '^CMS_ASSERTION_SECRET' secret-list.txt
          rm -f secret-list.txt
          pnpm exec wrangler deployments list --config workers/cms-api/wrangler.jsonc --env preview

      - name: Check preview Worker health
        run: |
          status=$(curl -s -o health.json -w '%{http_code}' https://zes-cms-api-preview.zescode.workers.dev/api/health)
          cat health.json
          rm -f health.json
          test "$status" = "200"

      - name: Preview CMS Worker workflow summary
        run: |
          echo "✅ preview CMS Worker deployed"
          echo "worker: zes-cms-api-preview"
          echo "url: https://zes-cms-api-preview.zescode.workers.dev"
          echo "database: zes-builder-preview"
